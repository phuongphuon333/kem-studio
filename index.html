<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEM STUDIO - Modern Minimalist Fashion</title>
    
    <!-- Tailwind CSS CDN & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS & Tailwind Config -->
    <script src="css/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cream-200">

    <!-- ANNOUNCEMENT BAR & HEADER -->
    <div class="bg-cream-900 text-cream-50 text-[11px] sm:text-xs py-2 px-4 font-medium tracking-wide">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <p class="mx-auto sm:mx-0 text-center">✨ Miễn phí vận chuyển cho đơn hàng từ 500k • Thời trang tối giản & Bền vững</p>
            <div class="hidden sm:flex items-center space-x-6 text-cream-200 text-[11px]">
                <a href="#" onclick="showSection('reviews'); return false;" class="hover:text-white transition">Đánh giá khách hàng</a>
                <span>|</span>
                <a href="#" onclick="showSection('home'); scrollToStory(); return false;" class="hover:text-white transition">Câu chuyện KEM</a>
            </div>
        </div>
    </div>

    <header class="sticky top-0 z-40 bg-cream-50/95 backdrop-blur-md border-b border-cream-200 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <button onclick="toggleMobileMenu()" class="lg:hidden text-cream-900 p-2 hover:scale-110 active:scale-95 transition">
                <i class="fa-solid fa-bars-staggered text-xl"></i>
            </button>
            <a href="#" onclick="showSection('home'); return false;" class="serif-title text-2xl sm:text-3xl font-bold tracking-wider text-cream-900 hover:opacity-80 transition flex-shrink-0">
                KEM <span class="text-xs tracking-widest font-sans font-light uppercase block sm:inline text-tan">Studio</span>
            </a>
            <div class="hidden md:flex flex-1 max-w-md mx-4 relative">
                <input type="text" id="global-search-input" onkeyup="handleSearch(event)" placeholder="Tìm kiếm túi canvas, áo khoác, quần túi hộp..." class="w-full pl-4 pr-10 py-2 rounded-full border border-cream-200 bg-white text-xs focus:outline-none focus:ring-2 focus:ring-tan/50 transition">
                <button onclick="executeSearch()" class="absolute right-1 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-cream-900 text-white flex items-center justify-center text-xs hover:bg-tan transition">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <div class="flex items-center space-x-3 sm:space-x-5">
                <button onclick="toggleWishlistDrawer()" class="relative p-2 text-cream-900 hover:text-tan transition hover:scale-110">
                    <i class="fa-regular fa-heart text-xl"></i>
                    <span id="wishlist-badge" class="absolute top-0 right-0 bg-tan text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                </button>
                <button onclick="toggleCartDrawer()" class="relative p-2 text-cream-900 hover:text-tan transition hover:scale-110">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute top-0 right-0 bg-cream-900 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
        <nav class="hidden lg:block border-t border-cream-200/60 bg-cream-100/50">
            <div class="max-w-7xl mx-auto px-8 flex items-center justify-center space-x-10 h-10 text-xs font-semibold tracking-wider uppercase">
                <button onclick="showSection('home')" class="nav-link">Trang Chủ</button>
                <button onclick="showSection('shop', 'all')" class="nav-link">Tất Cả Sản Phẩm</button>
                <button onclick="showSection('shop', 'canvas-bag')" class="nav-link">Túi Canvas</button>
                <button onclick="showSection('shop', 'jacket')" class="nav-link">Áo Khoác Dù</button>
                <button onclick="showSection('shop', 'cargo-pants')" class="nav-link">Quần Túi Hộp</button>
                <button onclick="showSection('reviews')" class="nav-link text-tan">Review Khách Hàng ⭐</button>
            </div>
        </nav>
    </header>

    <main class="flex-grow">
        <!-- Section Home, Shop, Detail, Reviews giữ nguyên cấu trúc container -->
        <section id="section-home" class="space-y-12 pb-16"><!-- Content injected via JS --></section>
        <section id="section-shop" class="hidden py-8"><!-- Content injected via JS --></section>
        <section id="section-detail" class="hidden py-8 sm:py-12"><!-- Content injected via JS --></section>
        <section id="section-reviews" class="hidden py-10"><!-- Content injected via JS --></section>
    </main>

    <!-- Slide-Over Drawers & Modals -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden"></div>
    <div id="toast-notification" class="fixed bottom-6 right-6 z-50 bg-cream-900 text-cream-50 px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <i class="fa-solid fa-circle-check text-green-400 text-lg"></i>
        <span id="toast-message" class="text-xs font-medium">Đã cập nhật!</span>
    </div>

    <!-- Tải các Module JavaScript theo đúng thứ tự dependency -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
